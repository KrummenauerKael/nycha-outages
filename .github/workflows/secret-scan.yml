name: secret-scan

# The local pre-commit hook is bypassable (--no-verify, or a fresh clone where
# nobody has run `pnpm install` yet), so the same scan runs here, where it
# cannot be skipped. Same script, same rules — see scripts/scan-secrets.mjs.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a credential removed from the tip is still live if it
          # sits in an earlier commit.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # Off deliberately. The default reads "packageManager" from
          # package.json and primes a pnpm cache, which fails here because this
          # job installs nothing — see the note on the scan steps below.
          package-manager-cache: false

      # No `pnpm install` — the scanner is dependency-free so that a compromised
      # or merely broken dependency cannot disable the check that guards keys.
      - name: Scan working tree
        run: node scripts/scan-secrets.mjs --all

      - name: Scan full history
        run: node scripts/scan-secrets.mjs --history
